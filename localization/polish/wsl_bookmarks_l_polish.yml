l_polish:

 bm_wsl_slavic_struggles:0 "Słowiańskie zmagania"
 bm_wsl_slavic_struggles_desc:0 "Świat słowiański stoi na rozdrożu. Związki plemienne ścierają się ze sobą, imperia powstają i upadają, a starzy bogowie stają w obliczu pochodu chrześcijaństwa. Od lasów Polanii po brzegi Adriatyku — kształtuj losy ludów słowiańskich."

 bm_wsl_siemowit:0 "Wódz Siemowit z Polanii"
 bm_wsl_siemowit_desc:0 "Syn legendarnego Piasta, Siemowit przewodzi Polanom lechickim z Gniezna. Jego małe plemienne władztwo otoczone jest przez rywali, lecz krew Piastów niesie wielkie ambicje."

 bm_wsl_svatopluk:0 "Książę Świętopełk Morawski"
 bm_wsl_svatopluk_desc:0 "Największy władca, jakiego Wielkie Morawy kiedykolwiek poznają. Świętopełk stoi u progu stworzenia potężnego słowiańskiego imperium, lecz frankijski cień wisi nad nim."

 bm_wsl_msciwoj:0 "Wódz Mściwoj Obodrzycki"
 bm_wsl_msciwoj_desc:0 "Przywódca związku obodrzyckiego, uwięziony między Cesarstwem Frankijskim a Duńczykami. Święte gaje żądają oporu, lecz przetrwanie wymaga sprytu."

 bm_wsl_dyre:0 "Wódz Dyr z Kijowa"
 bm_wsl_dyre_desc:0 "Nordycki wódz, który przejął władzę nad słowiańskimi Polanami. Dyr rządzi z Kijowa, lecz ród Ruryka w Nowogrodzie pożąda jego tronu."

 bm_wsl_boris:0 "Car Borys I Bułgarski"
 bm_wsl_boris_desc:0 "Borys przyjął chrześcijaństwo prawosławne, na zawsze zmieniając losy Bułgarii. Teraz musi utrzymać swoje państwo w całości, gdy stare tradycje ścierają się z nową wiarą."

 bm_wsl_mutimir:0 "Wielki Żupan Mutimir Serbski"
 bm_wsl_mutimir_desc:0 "Władca Raszki, Mutimir dzierży serbskie ziemie między ambicjami Bułgarii a Bizancjum. Stara wiara słowiańska wciąż płonie mocno."

 bm_wsl_domagoj:0 "Książę Domagoj Chorwacki"
 bm_wsl_domagoj_desc:0 "Waleczny chorwacki książę znany z nieustępliwych wypraw przeciw saracenskim piratom i frankijskim zwierzchnikom. Jego władztwo strzeże adriatyckiego brzegu."
