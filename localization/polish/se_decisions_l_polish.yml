l_polish:
 se_reform_panslavic_faith:0 "Zreformuj Wszechsłowiańską Wiarę"
 se_reform_panslavic_faith_desc:0 "Zjednocz trzy odłamy słowiańskiego pogaństwa — wschodni, zachodni i południowy — w jedną zinstytucjonalizowaną wiarę, zdolną przeciwstawić się napierającym religiom abrahamowym."
 se_reform_panslavic_faith_tooltip:0 "Musisz kontrolować święte miejsca ze wszystkich trzech odłamów i dowodzić szacunkiem słowiańskiego świata."
 se_reform_tooltip_shared_sites:0 "Musisz kontrolować wspólne święte miejsca"
 se_reform_tooltip_regional_sites:0 "Musisz kontrolować co najmniej 2 święte miejsca z każdego regionalnego odłamu"
 se_reform_tooltip_pagan_threshold:0 "Co najmniej połowa słowiańskich prowincji musi wciąż wyznawać słowiańską wiarę pogańską"
 se_modifier_unifier_of_faiths:0 "Zjednoczyciel Słowiańskich Wiar"
 se_reform_slavic_base:0 "Przywróć Prasłowiańską Wiarę"
 se_reform_slavic_base_desc:0 "Choć słowiańska wiara rozdzieliła się na odłamy wschodni, zachodni i południowy, jej korzenie biją z tej samej świętej ziemi. Przejmując święte miejsca swojego ludu — i sięgając po te, które czczą słowiańscy bracia — możesz przywołać do życia pradawne obrzędy, które niegdyś łączyły wszystkich Słowian."
 se_reform_slavic_base_tooltip:0 "Kontroluj święte miejsca swojej wiary i co najmniej jedno miejsce innego odłamu słowiańskiego."
 se_reform_tooltip_3_own_holy_sites:0 "Kontroluj co najmniej 3 święte miejsca własnej wiary"
 se_reform_tooltip_1_other_slavic_holy_site:0 "Kontroluj co najmniej 1 święte miejsce innego odłamu słowiańskiego"
 se_reform_tooltip_requires_base:0 "Musisz najpierw przywrócić Prasłowiańską Wiarę"
 se_modifier_restorer_of_ancient_faith:0 "Odnowiciel Pradawnej Wiary"
 se_modifier_restorer_of_ancient_faith_desc:0 "Dynastia wskrzesiła pradawne obrzędy słowiańskie, zbliżając się do bogów przodków."
 se_modifier_reform_momentum:0 "Sakralny Impet"
 se_modifier_reform_momentum_desc:0 "Święte ognie płoną jasno. Droga ku Wszechsłowiańskiej Wierze staje się coraz wyraźniejsza."
 se_opinion_returned_to_roots:0 "Powrót do Starych Dróg"
