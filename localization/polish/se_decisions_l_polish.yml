l_polish:
 se_check_holy_sites:0 "Zbadaj Słowiańskie Miejsca Święte"
 se_check_holy_sites_desc:0 "Wołchwowie donoszą, ile z piętnastu świętych miejsc słowiańskiego świata spoczywa pod twoją władzą. Im więcej z nich opanujesz przed reformacją, tym silniej bogowie odpowiedzą na twój głos."
 se_check_holy_sites_tooltip:0 "Sprawdź, ile z 15 słowiańskich miejsc świętych kontrolujesz i jaki próg nagrody cię czeka."
 se_check_holy_sites_confirm:0 "Rozumiem"
 se_check_tooltip_reward:0 "Co najmniej 9 z 15 miejsc świętych → #G Nagroda #! (+500 pobożności, +250 prestiżu, modifier na 30 lat)"
 se_check_tooltip_neutral:0 "Co najmniej 6 z 15 miejsc świętych → #Y Stan zerowy #! (bez nagrody i kary)"
 se_check_tooltip_penalty:0 "Mniej niż 6 → #R Kara #! (-300 pobożności, modifier kary na 15 lat)"
