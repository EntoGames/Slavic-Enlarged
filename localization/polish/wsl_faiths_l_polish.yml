 wsl_slavic_base: "Rodzima Wiara"
 wsl_slavic_base_desc: "Pierwotna wiara słowiańska, wspólna dla wszystkich Słowian przed regionalnym rozdzieleniem. Oparta na wielkiej trójcy Peruna, Wełesa i Dadźboga."
 wsl_slavic_east: "Rodnowierstwo Wschodnie"
 wsl_slavic_east_desc: "Wiara wschodniosłowiańskich ludów, gdzie Perun Gromowładny sprawuje najwyższą władzę. Ukształtowana przez stepowe pogranicze i kulturę wojowniczej drużyny."
 wsl_slavic_west: "Rodnowierstwo Zachodnie"
 wsl_slavic_west_desc: "Wiara zachodniosłowiańskich ludów, gdzie Świętowit z Arkony panuje niepodzielnie. Wyróżnia ją niezwykły stopień organizacji kapłańskiej."
 wsl_slavic_south: "Rodnowierstwo Południowe"
 wsl_slavic_south_desc: "Wiara południowosłowiańskich ludów, ukształtowana przez góry i cień Bizancjum. Zadruga jest zarazem rodziną i kongregacją."
 wsl_slavic_unified: "Wszechrodzima Wiara"
 wsl_slavic_unified_desc: "Wielka synteza: zjednoczona, zinstytucjonalizowana wiara obejmująca wszystkie trzy odłamy słowiańskiego pogaństwa."
