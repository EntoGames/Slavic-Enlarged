l_polish:
 se_reform.0001.t: "Święta Ziemia Odpowiedziała"
 se_reform.0001.desc: "Obrzędy zostały wypowiedziane na całej długości i szerokości ziem słowiańskich. Dziewięć świętych miejsc — świątyń Wschodu, Zachodu, Południa — usłyszało twój głos. Bogowie twoich przodków nie mówią tej nocy szeptem. Ryczą."
 se_reform.0001.a: "Stara wiara odrodziła się w pełni swej mocy."
 se_reform.0002.t: "Wiara Zreformowana w Pośpiechu"
 se_reform.0002.desc: "Obrzędy zostały wypowiedziane, lecz święta ziemia nie odpowiada jeszcze w pełni. Zbyt wiele świętych miejsc pozostaje w rękach obcych, a ich ognie pielęgnują ci, którzy nie znają starych słów. Bogowie cię uznają — ale nie są zadowoleni."
 se_reform.0002.a: "Z czasem zaopiekujemy się pozostałymi świętymi ogniskami."
 se_reform.0003.t: "Wiara Zreformowana"
 se_reform.0003.desc: "Obrzędy zostały wypowiedziane. Święta ziemia drży — usłyszała cię, choć nie wszystkie jej przybytki jeszcze odpowiedziały. Bogowie nie są ani szczególnie zadowoleni, ani niezadowoleni. Droga wciąż jest przed tobą."
 se_reform.0003.a: "Kroczymy ścieżką. Święte ognie będą się szerzyć."
