 se_debug_ok:0 "OK"
 se_debug.0006.t: "DEBUG: Wymuś Divergencję"
 se_debug.0006.desc: "Wybierz odłam słowiański, na który chcesz przejść."
 se_debug.0006.a: "Rodnowierstwo Wschodnie"
 se_debug.0006.b: "Rodnowierstwo Zachodnie"
 se_debug.0006.c: "Rodnowierstwo Południowe"
 se_debug.0006.d: "Anuluj"
 se_main.0001.t: "Wszechrodzima Wiara"
 se_main.0001.desc: "Trzy odłamy słowiańskiej wiary zostały zjednoczone pod jednym sztandarem. Dawne podziały — wschodni grom, zachodnia przepowiednia i południowy ogień klanu — to już przeszłość. Nowa era się rozpoczyna."
 se_main.0001.a: "Z woli Peruna!"
 se_reform.0001.t: "Żar Pradawnej Wiary"
 se_reform.0001.desc: "Obrzędy zostały dopełnione. Święte gaje usłyszały twój głos i głosy twoich przodków. To jeszcze nie pełna synteza wszystkich ludów słowiańskich — lecz pradawne ognie zapłonęły na nowo. Wołchwowie mówią o tym jak o początku: odzyskaniu czegoś, co zdawało się utracone na zawsze."
 se_reform.0001.a: "Stare drogi nas jednoczą. Niech ci, którzy dzielą nasze korzenie, zapamiętają ten dzień."
 se_reform.0001.b: "To tylko pierwszy krok. Bogowie żądają, byśmy poszli dalej."
 se_reform.0001.c: "Niech święte ognie nas prowadzą. Sprowadźcie do mojego dworu najmędrszego z wołchwów."
