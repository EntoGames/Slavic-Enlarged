l_polish:
 wsl_reform_panslavic_faith:0 "Zreformuj Wszechsłowiańską Wiarę"
 wsl_reform_panslavic_faith_desc:0 "Zjednocz trzy odłamy słowiańskiego pogaństwa — wschodni, zachodni i południowy — w jedną zinstytucjonalizowaną wiarę, zdolną przeciwstawić się napierającym religiom abrahamowym."
 wsl_reform_panslavic_faith_tooltip:0 "Musisz kontrolować święte miejsca ze wszystkich trzech odłamów i dowodzić szacunkiem słowiańskiego świata."
 wsl_reform_tooltip_shared_sites:0 "Musisz kontrolować wspólne święte miejsca"
 wsl_reform_tooltip_regional_sites:0 "Musisz kontrolować co najmniej 2 święte miejsca z każdego regionalnego odłamu"
 wsl_reform_tooltip_pagan_threshold:0 "Co najmniej połowa słowiańskich prowincji musi wciąż wyznawać słowiańską wiarę pogańską"
 wsl_modifier_unifier_of_faiths:0 "Zjednoczyciel Słowiańskich Wiar"