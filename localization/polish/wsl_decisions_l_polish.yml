l_polish:
 wsl_reform_panslavic_faith: "Zreformuj Wszechsłowiańską Wiarę"
 wsl_reform_panslavic_faith_desc: "Zjednocz trzy odłamy słowiańskiego pogaństwa — wschodni, zachodni i południowy — w jedną zinstytucjonalizowaną wiarę, zdolną przeciwstawić się napierającym religiom abrahamowym."
 wsl_reform_panslavic_faith_tooltip: "Musisz kontrolować święte miejsca ze wszystkich trzech odłamów i dowodzić szacunkiem słowiańskiego świata."
 wsl_reform_tooltip_shared_sites: "Musisz kontrolować wspólne święte miejsca"
 wsl_reform_tooltip_regional_sites: "Musisz kontrolować co najmniej 2 święte miejsca z każdego regionalnego odłamu"
 wsl_reform_tooltip_pagan_threshold: "Co najmniej połowa słowiańskich prowincji musi wciąż wyznawać słowiańską wiarę pogańską"
 wsl_modifier_unifier_of_faiths: "Zjednoczyciel Słowiańskich Wiar"