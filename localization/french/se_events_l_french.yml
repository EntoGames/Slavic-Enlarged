l_french:
 se_reform.0001.t: "La Terre Sacrée a Répondu"
 se_reform.0001.desc: "Les rites ont été prononcés aux quatre coins des terres slaves. Neuf lieux saints — sanctuaires de l'Est, de l'Ouest, du Sud — ont entendu votre voix. Les dieux de vos ancêtres ne parlent pas en murmures cette nuit. Ils rugissent."
 se_reform.0001.a: "L'ancienne foi renaît dans toute sa force."
 se_reform.0002.t: "Une Foi Réformée à la Hâte"
 se_reform.0002.desc: "Les rites sont prononcés, mais la terre sacrée ne répond pas encore pleinement. Trop de lieux saints restent entre les mains d'étrangers. Les dieux vous reconnaissent — mais ils ne sont pas satisfaits."
 se_reform.0002.a: "Nous veillerons sur les feux sacrés restants en temps voulu."
 se_reform.0003.t: "Une Foi Réformée"
 se_reform.0003.desc: "Les rites sont prononcés. La terre sacrée frémit — elle vous a entendu, même si tous ses sanctuaires n'ont pas encore répondu. Les dieux ne sont ni particulièrement satisfaits ni mécontents. Il reste encore du chemin à parcourir."
 se_reform.0003.a: "Nous marchons sur la voie. Les feux sacrés se répandront."
