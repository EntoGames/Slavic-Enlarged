l_english:
 wsl_reform_panslavic_faith: "Reform the All-Slavic Faith"
 wsl_reform_panslavic_faith_desc: "Unite the three branches of Slavic paganism — Eastern, Western, and Southern — into a single, institutionalized faith that can stand against the encroaching Abrahamic religions."
 wsl_reform_panslavic_faith_tooltip: "You must control holy sites from all three branches and command the respect of the Slavic world."
 wsl_reform_tooltip_shared_sites: "You must control the shared holy sites"
 wsl_reform_tooltip_regional_sites: "You must control at least 2 holy sites from each regional branch"
 wsl_reform_tooltip_pagan_threshold: "At least half of all Slavic counties must still follow a Slavic pagan faith"
 wsl_modifier_unifier_of_faiths: "Unifier of the Slavic Faiths"