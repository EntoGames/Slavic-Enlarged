l_english:
 se_check_holy_sites:0 "Assess the Slavic Holy Sites"
 se_check_holy_sites_desc:0 "The volkhvy report how many of the fifteen holy places of the Slavic world lie under your rule. The more you hold when you reform your faith, the stronger the gods will answer."
 se_check_holy_sites_tooltip:0 "Check how many of the 15 Slavic holy sites you control and which reward tier awaits you."
 se_check_holy_sites_confirm:0 "Understood"
 se_check_tooltip_reward:0 "Control at least 9 of 15 holy sites → #G Reward #! (+500 piety, +250 prestige, 30-year bonus modifier)"
 se_check_tooltip_neutral:0 "Control at least 6 of 15 holy sites → #Y Neutral #! (no reward, no penalty)"
 se_check_tooltip_penalty:0 "Control fewer than 6 → #R Penalty #! (-300 piety, 15-year malus modifier)"
