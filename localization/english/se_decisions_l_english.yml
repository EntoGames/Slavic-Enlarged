l_english:
 se_reform_panslavic_faith:0 "Reform the All-Slavic Faith"
 se_reform_panslavic_faith_desc:0 "Unite the three branches of Slavic paganism — Eastern, Western, and Southern — into a single, institutionalized faith that can stand against the encroaching Abrahamic religions."
 se_reform_panslavic_faith_tooltip:0 "You must control holy sites from all three branches and command the respect of the Slavic world."
 se_reform_tooltip_shared_sites:0 "You must control the shared holy sites"
 se_reform_tooltip_regional_sites:0 "You must control at least 2 holy sites from each regional branch"
 se_reform_tooltip_pagan_threshold:0 "At least half of all Slavic counties must still follow a Slavic pagan faith"
 se_modifier_unifier_of_faiths:0 "Unifier of the Slavic Faiths"
 se_reform_slavic_base:0 "Restore the Ancient Slavic Faith"
 se_reform_slavic_base_desc:0 "Though the Slavic faith has divided into Eastern, Western, and Southern branches, its roots run from the same sacred soil. By claiming the holy places of your own people — and reaching beyond to those of your Slavic kin — you may reawaken the primal rites that once bound all Slavs together."
 se_reform_slavic_base_tooltip:0 "Control the holy sites of your faith and at least one site of a fellow Slavic branch."
 se_reform_tooltip_3_own_holy_sites:0 "Control at least 3 of your faith's holy sites"
 se_reform_tooltip_1_other_slavic_holy_site:0 "Control at least 1 holy site from a different Slavic branch"
 se_reform_tooltip_requires_base:0 "You must first restore the Ancient Slavic Faith"
 se_modifier_restorer_of_ancient_faith:0 "Restorer of the Ancient Faith"
 se_modifier_restorer_of_ancient_faith_desc:0 "This dynasty has rekindled the primal Slavic rites, drawing closer to the gods of old."
 se_modifier_reform_momentum:0 "Sacred Momentum"
 se_modifier_reform_momentum_desc:0 "The sacred fires burn bright. The path toward the All-Slavic Faith grows clearer."
 se_opinion_returned_to_roots:0 "Returned to the Old Ways"
