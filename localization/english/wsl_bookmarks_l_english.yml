l_english:

 bm_wsl_slavic_struggles:0 "Slavic Struggles"
 bm_wsl_slavic_struggles_desc:0 "The Slavic world stands at a crossroads. Tribal federations clash, empires rise and fall, and the old gods face the march of Christianity. From the forests of Polania to the shores of the Adriatic, shape the destiny of the Slavic peoples."

 bm_wsl_siemowit:0 "Chief Siemowit of Polania"
 bm_wsl_siemowit_desc:0 "Son of the legendary Piast, Siemowit leads the Lechitic Polans from Gniezno. His small tribal realm is surrounded by rivals, but the Piast bloodline carries great ambitions."

 bm_wsl_svatopluk:0 "Duke Svatopluk of Moravia"
 bm_wsl_svatopluk_desc:0 "The greatest ruler Great Moravia will ever know. Svatopluk stands poised to forge a mighty Slavic empire, but the Frankish shadow looms large."

 bm_wsl_msciwoj:0 "Chief Msciwoj of the Obodrites"
 bm_wsl_msciwoj_desc:0 "Leader of the Obodrite federation, caught between the Frankish Empire and the Danes. The sacred groves demand defiance, but survival requires cunning."

 bm_wsl_dyre:0 "Chieftain Dyre of Kiev"
 bm_wsl_dyre_desc:0 "A Norse warlord who has seized power over the Slavic Polyans. Dyre rules from Kiev, but Rurik's kin in Novgorod covet his throne."

 bm_wsl_boris:0 "Tsar Boris I of Bulgaria"
 bm_wsl_boris_desc:0 "Boris has embraced Orthodox Christianity, forever changing Bulgaria's path. Now he must hold his realm together as old traditions clash with the new faith."

 bm_wsl_mutimir:0 "Grand Zhupan Mutimir of Serbia"
 bm_wsl_mutimir_desc:0 "Ruler of Rashka, Mutimir holds the Serbian lands between the ambitions of Bulgaria and Byzantium. The old Slavic faith still burns strong."

 bm_wsl_domagoj:0 "Duke Domagoj of Croatia"
 bm_wsl_domagoj_desc:0 "A fierce Croatian duke known for his relentless campaigns against Saracen pirates and Frankish overlords. His realm guards the Adriatic shore."
