 wsl_slavic_base: "Rodnovery"
 wsl_slavic_base_desc: "The primordial Slavic faith, shared by all Slavic peoples before regional divergence. Centered on the great triad of Perun, Veles, and Dazhbog."
 wsl_slavic_east: "Eastern Rodnovery"
 wsl_slavic_east_desc: "The faith of the Eastern Slavic peoples, where Perun the Thunderer holds supreme authority. Shaped by the steppe frontier and the warrior culture of the druzhina."
 wsl_slavic_west: "Western Rodnovery"
 wsl_slavic_west_desc: "The faith of the Western Slavic peoples, where Svantevit of Arkona reigns supreme. Distinguished by a remarkable degree of priestly organization."
 wsl_slavic_south: "Southern Rodnovery"
 wsl_slavic_south_desc: "The faith of the Southern Slavic peoples, shaped by the mountains and the Byzantine shadow. The zadruga is both the family and the congregation."
 wsl_slavic_unified: "All-Slavic Faith"
 wsl_slavic_unified_desc: "The great synthesis: a unified, institutionalized faith encompassing all three branches of Slavic paganism."
