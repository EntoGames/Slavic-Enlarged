l_english:
 se_reform.0001.t: "The Sacred Earth Answered"
 se_reform.0001.desc: "The rites are spoken across the length and breadth of the Slavic lands. Nine holy places — shrines of the East, the West, the South — have heard your voice. The gods of your ancestors do not speak in whispers tonight. They roar."
 se_reform.0001.a: "The old faith is reborn in its full strength."
 se_reform.0002.t: "A Faith Reformed in Haste"
 se_reform.0002.desc: "The rites are spoken, but the sacred earth does not yet fully answer. Too many holy places remain in the hands of strangers, their fires tended by those who do not know the old words. The gods acknowledge you — but they are not pleased."
 se_reform.0002.a: "We will tend the remaining sacred fires in time."
 se_reform.0003.t: "A Faith Reformed"
 se_reform.0003.desc: "The rites are spoken. The sacred earth stirs — it has heard you, though not all its shrines have yet answered your call. The gods are neither greatly pleased nor displeased. There is still work to be done."
 se_reform.0003.a: "We walk the path. The holy fires will spread."
