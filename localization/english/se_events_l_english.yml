 se_main.0001.t: "The All-Slavic Faith"
 se_main.0001.desc: "The three branches of the Slavic faith have been united under a single banner. The old divisions — Eastern thunder, Western prophecy, and Southern clan-fire — are no more. A new era begins."
 se_main.0001.a: "By the will of Perun!"
 se_reform.0001.t: "The Embers of the Ancient Faith"
 se_reform.0001.desc: "The rites are spoken. The sacred groves have heard your voice and the voice of your ancestors. This is not yet the full synthesis of all Slavic peoples — but the ancient fires have been lit once more. The wołchwowie call it a beginning: the recovery of something long thought lost."
 se_reform.0001.a: "The old ways unite us. Let all who share our roots remember this day."
 se_reform.0001.b: "This is only the first step. The gods demand we go further."
 se_reform.0001.c: "Let the sacred fires guide us. Summon the wisest of the wołchwowie to my court."
