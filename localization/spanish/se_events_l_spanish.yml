l_spanish:
 se_reform.0001.t: "La Tierra Sagrada Ha Respondido"
 se_reform.0001.desc: "Los ritos han sido pronunciados a lo largo y ancho de las tierras eslavas. Nueve lugares santos han escuchado tu voz. Los dioses de tus antepasados no hablan en susurros esta noche. Rugen."
 se_reform.0001.a: "La antigua fe renace en toda su fuerza."
 se_reform.0002.t: "Una Fe Reformada con Precipitación"
 se_reform.0002.desc: "Los ritos han sido pronunciados, pero la tierra sagrada no responde aún plenamente. Demasiados lugares santos permanecen en manos de extraños. Los dioses te reconocen — pero no están complacidos."
 se_reform.0002.a: "Con el tiempo cuidaremos los fuegos sagrados restantes."
 se_reform.0003.t: "Una Fe Reformada"
 se_reform.0003.desc: "Los ritos han sido pronunciados. La tierra sagrada se estremece — te ha escuchado, aunque no todos sus santuarios han respondido aún. Los dioses no están ni especialmente complacidos ni descontentos. Aún queda camino por recorrer."
 se_reform.0003.a: "Caminamos por la senda. Los fuegos sagrados se extenderán."
