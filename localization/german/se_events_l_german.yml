l_german:
 se_reform.0001.t: "Die Heilige Erde Hat Geantwortet"
 se_reform.0001.desc: "Die Riten sind über das gesamte slawische Land hinweg gesprochen worden. Neun heilige Stätten haben Eure Stimme gehört. Die Götter Eurer Ahnen sprechen in dieser Nacht nicht in Flüstertönen. Sie brüllen."
 se_reform.0001.a: "Der alte Glaube ist in seiner vollen Stärke wiedergeboren."
 se_reform.0002.t: "Ein In Eile Reformierter Glaube"
 se_reform.0002.desc: "Die Riten sind gesprochen, doch die heilige Erde antwortet noch nicht vollständig. Zu viele heilige Stätten befinden sich in fremden Händen. Die Götter erkennen Euch an — doch sie sind nicht erfreut."
 se_reform.0002.a: "Wir werden die verbleibenden heiligen Feuer zu gegebener Zeit hüten."
 se_reform.0003.t: "Ein Reformierter Glaube"
 se_reform.0003.desc: "Die Riten sind gesprochen. Die heilige Erde bebt — sie hat Euch gehört, obwohl noch nicht alle ihre Heiligtümer geantwortet haben. Die Götter sind weder besonders erfreut noch unzufrieden. Es bleibt noch Arbeit zu tun."
 se_reform.0003.a: "Wir gehen den Weg. Die heiligen Feuer werden sich ausbreiten."
